const MANNSCHAFTEN = ["1. Herren","2. Herren","3. Herren","1. Damen","2. Damen","3. Damen"];
const GETRAENKE_DEFAULT = [
  {name:"Cola",preis:1.00,emoji:"🥤"},
  {name:"Wasser",preis:0.50,emoji:"💧"},
  {name:"Fanta",preis:1.00,emoji:"🍊"},
  {name:"Bier",preis:1.50,emoji:"🍺"},
  {name:"Kaffee",preis:0.80,emoji:"☕"},
  {name:"Iso",preis:1.20,emoji:"⚡"},
];
const CATS = {
  getraenk:{label:"Getränk",emoji:"🥤",color:"#2288FF"},
  einnahme:{label:"Einnahme",emoji:"💰",color:"#4ade80"},
  ausgabe:{label:"Ausgabe",emoji:"🛒",color:"#f87171"},
  spende:{label:"Spende",emoji:"🤝",color:"#60a5fa"},
};
const EMOJIS = ["🥤","🍺","☕","💧","🍊","⚡","🧃","🫖","🍵","🥛","🍋","🧊"];
const COLORS = ["#0066CC","#4ade80","#60a5fa","#f472b6","#a78bfa","#34d399","#fb923c","#38bdf8"];
const pCol = (id) => COLORS[Math.abs(String(id).split("").reduce((a,c)=>a+c.charCodeAt(0),0))%COLORS.length];
const ava = (name) => name.trim().split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2);
const todayStr = () => new Date().toISOString().split("T")[0];
const fmtD = (r) => r?new Date(r+"T12:00:00").toLocaleDateString("de-DE"):"";
const mkU = (v,n) => (v.trim().toLowerCase()+"."+n.trim().toLowerCase()).replace(/\s+/g,"");
const sv = (k,v) => {try{localStorage.setItem(k,JSON.stringify(v));}catch{}};
const ld = (k,fb) => {try{const r=localStorage.getItem(k);return r?JSON.parse(r):fb;}catch{return fb;}};
const IS = {width:"100%",marginTop:8,padding:"13px 16px",background:"rgba(255,255,255,0.05)",border:"1px solid #003070",borderRadius:12,color:"#e2e8f0",fontSize:15,outline:"none",boxSizing:"border-box"};

function Login({onLogin,benutzer}) {
  const [u,setU]=useState(""); const [p,setP]=useState(""); const [err,setErr]=useState(""); const [shake,setShake]=useState(false);
  const go = () => {
    const b=benutzer.find(x=>x.benutzername===u.trim().toLowerCase());
    if(!b){doShake("❌ Benutzername unbekannt");return;}
    if(b.passwort!==p){doShake("❌ Falsches Passwort");return;}
    const ud={id:b.id,benutzername:b.benutzername,rolle:b.rolle,vorname:b.vorname,nachname:b.nachname,mannschaft:b.mannschaft||""};
    sv(AUTH_KEY,ud); onLogin(ud);
  };
  const doShake=(msg)=>{setErr(msg);setShake(true);setP("");setTimeout(()=>setShake(false),500);};
  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(160deg,#00112E,#001A3A)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",color:"#e2e8f0",padding:32}}>
      <img src={LOGO} style={{width:100,height:100,objectFit:"contain",marginBottom:16}}/>
      <div style={{fontSize:22,fontWeight:800,marginBottom:4}}>HSG Emden Kasse</div>
      <div style={{fontSize:13,color:"#94a3b8",marginBottom:32}}>HSG Emden — Bitte anmelden</div>
      <div style={{width:"100%",maxWidth:320,animation:shake?"shake 0.4s ease":"none"}}>
        <label style={{fontSize:11,color:"#94a3b8",fontWeight:700,letterSpacing:1,display:"block"}}>BENUTZERNAME</label>
        <input type="text" placeholder="vorname.nachname" value={u} onChange={e=>{setU(e.target.value);setErr("");}} onKeyDown={e=>e.key==="Enter"&&go()} autoFocus style={IS}/>
        <label style={{fontSize:11,color:"#94a3b8",fontWeight:700,letterSpacing:1,display:"block",marginTop:14}}>PASSWORT</label>
        <input type="password" placeholder="Passwort eingeben..." value={p} onChange={e=>{setP(e.target.value);setErr("");}} onKeyDown={e=>e.key==="Enter"&&go()} style={{...IS,border:`2px solid ${err?"#f87171":"#003070"}`}}/>
        {err&&<div style={{color:"#f87171",fontSize:12,fontWeight:600,marginTop:8}}>{err}</div>}
        <button onClick={go} style={{width:"100%",marginTop:18,padding:"15px",background:"linear-gradient(135deg,#0066CC,#2288FF)",border:"none",borderRadius:14,color:"white",fontSize:15,fontWeight:800,cursor:"pointer"}}>🔓 Anmelden</button>
      </div>
      <div style={{marginTop:36,fontSize:12,color:"#334155"}}>🔒 Geschützte Vereinskasse</div>
    </div>
  );
}

function BenutzerTab({benutzer,cu,toast}) {
  const [form,setForm]=useState({vorname:"",nachname:"",passwort:"",rolle:"mitglied",mannschaft:"1. Herren"});
  const [edit,setEdit]=useState(null);
  const [gutModal,setGutModal]=useState(null);
  const [gutVal,setGutVal]=useState("");
  const bn=(v,n)=>mkU(v,n);

  const add = async()=>{
    if(!form.vorname.trim()||!form.nachname.trim())return toast("Vor- und Nachname erforderlich!");
    if(!form.passwort.trim()||form.passwort.length<4)return toast("Passwort mind. 4 Zeichen!");
    const b=bn(form.vorname,form.nachname);
    if(benutzer.find(x=>x.benutzername===b))return toast("Benutzername bereits vergeben!");
    await col("benutzer").add({vorname:form.vorname.trim(),nachname:form.nachname.trim(),benutzername:b,passwort:form.passwort.trim(),rolle:form.rolle,mannschaft:form.mannschaft,guthaben:0});
    setForm({vorname:"",nachname:"",passwort:"",rolle:"mitglied",mannschaft:"1. Herren"});
    toast("✅ Benutzer angelegt!");
  };
  const del = async(id)=>{if(id===cu.id)return toast("Du kannst dich nicht selbst löschen!"); await ref("benutzer",id).delete();toast("🗑️ Gelöscht");};
  const saveEdit = async()=>{
    if(!edit.vorname.trim()||!edit.nachname.trim())return;
    await ref("benutzer",edit.id).set({vorname:edit.vorname.trim(),nachname:edit.nachname.trim(),benutzername:bn(edit.vorname,edit.nachname),passwort:edit.passwort.trim(),rolle:edit.rolle,mannschaft:edit.mannschaft||"1. Herren",guthaben:edit.guthaben||0});
    setEdit(null);toast("✅ Gespeichert");
  };
  const aufladen = async()=>{
    const b=parseFloat(gutVal.replace(",","."));
    if(!b||b<=0)return toast("Bitte gültigen Betrag eingeben!");
    await ref("benutzer",gutModal.id).update({guthaben:(gutModal.guthaben||0)+b});
    // Kein Kassen-Eintrag beim Aufladen — Guthaben ist internes Spielerkonto
    setGutModal(null);setGutVal("");toast(`✅ ${b.toFixed(2)} € aufgeladen!`);
  };

  const admins=benutzer.filter(b=>b.rolle==="admin");
  const gruppen=MANNSCHAFTEN.map(m=>({name:m,list:benutzer.filter(b=>b.rolle!=="admin"&&(b.mannschaft||"1. Herren")===m)})).filter(g=>g.list.length>0);

  const card=(b)=>(
    <div key={b.id}>
      {edit?.id===b.id?(

  return (

          <div style={{flex:1}}><label style={{fontSize:11,color:"#94a3b8",fontWeight:700,display:"block"}}>NACHNAME</label><input type="text" placeholder="Mustermann" value={form.nachname} onChange={e=>setForm(f=>({...f,nachname:e.target.value}))} style={IS}/></div>
        </div>

        <label style={{fontSize:11,color:"#94a3b8",fontWeight:700,display:"block",marginTop:10}}>PASSWORT</label>
        <input type="text" placeholder="Mind. 4 Zeichen" value={form.passwort} onChange={e=>setForm(f=>({...f,passwort:e.target.value}))} style={IS}/>
        <label style={{fontSize:11,color:"#94a3b8",fontWeight:700,display:"block",marginTop:10}}>MANNSCHAFT</label>
        <select value={form.mannschaft} onChange={e=>setForm(f=>({...f,mannschaft:e.target.value}))} style={IS}>
          {MANNSCHAFTEN.map(m=><option key={m} value={m}>{m}</option>)}
        </select>
        <label style={{fontSize:11,color:"#94a3b8",fontWeight:700,display:"block",marginTop:10}}>ROLLE</label>
        <select value={form.rolle} onChange={e=>setForm(f=>({...f,rolle:e.target.value}))} style={IS}>
          <option value="mitglied">Mitglied</option><option value="admin">Admin</option>
        </select>
        <button onClick={add} style={{width:"100%",marginTop:14,padding:"12px",background:"linear-gradient(135deg,#0066CC,#2288FF)",border:"none",borderRadius:12,color:"white",fontSize:14,fontWeight:800,cursor:"pointer"}}>✅ Benutzer anlegen</button>
      </div>

      {admins.length>0&&<><div style={{fontSize:11,color:"#2288FF",fontWeight:700,letterSpacing:1,marginBottom:8}}>👑 ADMINS</div>{admins.map(b=>card(b))}</>}
      {gruppen.map(g=>(
        <div key={g.name}>
          <div style={{fontSize:11,color:"#94a3b8",fontWeight:700,letterSpacing:1,marginBottom:8,marginTop:14}}>🤾 {g.name.toUpperCase()}</div>
          {g.list.map(b=>card(b))}
        </div>
      ))}
    </div>
  );
}

function MainApp({cu,onLogout}) {
  const [eintraege,setEintraege]=useState([]);
  const [spieler,setSpieler]=useState([]);
  const [getraenke,setGetraenke]=useState([]);
  const [benutzer,setBenutzer]=useState([]);
  const [loading,setLoading]=useState(true);
  const [tab,setTab]=useState("konto");
  const [toastMsg,setToastMsg]=useState(null);
  const [gwS,setGwS]=useState(null);
  const [datum,setDatum]=useState(todayStr());
  const [zahlart,setZahlart]=useState("direkt");
  const [mForm,setMForm]=useState({typ:"einnahme",betrag:"",beschreibung:"",person:"",datum:todayStr()});
  const [nName,setNName]=useState("");
  const [editSp,setEditSp]=useState(null);
  const [gForm,setGForm]=useState({name:"",preis:"",emoji:"🥤"});
  const [editG,setEditG]=useState(null);
  const [vF,setVF]=useState("alle");
  const [vS,setVS]=useState("alle");
  const isAdmin=cu.rolle==="admin";
  const toast=(msg)=>{setToastMsg(msg);setTimeout(()=>setToastMsg(null),2800);};

  useEffect(()=>{
    let n=0; const done=()=>{n++;if(n>=4)setLoading(false);};
    const u1=col("eintraege").onSnapshot(s=>{setEintraege(s.docs.map(d=>({id:d.id,...d.data()})));done();});
    const u2=col("spieler").onSnapshot(s=>{setSpieler(s.docs.map(d=>({id:d.id,...d.data()})));done();});
    const u3=col("getraenke").onSnapshot(s=>{const l=s.docs.map(d=>({id:d.id,...d.data()}));if(l.length===0)GETRAENKE_DEFAULT.forEach(g=>col("getraenke").add(g));setGetraenke(l);done();});
    const u4=col("benutzer").onSnapshot(s=>{setBenutzer(s.docs.map(d=>({id:d.id,...d.data()})));done();});
    return()=>{u1();u2();u3();u4();};
  },[]);

  const gwSObj=spieler.find(s=>s.id===gwS);
  const gwBu=gwSObj?benutzer.find(b=>b.vorname+" "+b.nachname===gwSObj.name):null;
  const gut=gwBu?.guthaben||0;

  const buchG=async(g)=>{
    if(!gwS)return toast("⚠️ Bitte erst Spieler auswählen!");
    const sp=spieler.find(s=>s.id===gwS);
    if(zahlart==="guthaben"){
      if(!gwBu)return toast("⚠️ Kein Benutzer für diesen Spieler gefunden!");
      if(gut<g.preis)return toast(`⚠️ Guthaben reicht nicht! (${gut.toFixed(2)} €)`);
      await ref("benutzer",gwBu.id).update({guthaben:gut-g.preis});
    }
    await col("eintraege").add({typ:"getraenk",betrag:g.preis,beschreibung:g.name,getraenkEmoji:g.emoji,person:sp.name,spielerId:sp.id,datum:fmtD(datum),datumRaw:datum,zeit:new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}),gebuchtvon:cu.benutzername,zahlart,ts:Date.now()});
    toast(`✅ ${g.emoji} ${g.name} für ${sp.name}! (${zahlart==="guthaben"?"💰 Guthaben":"💵 Direkt"})`);
  };
  const addManual=async()=>{
    const b=parseFloat(mForm.betrag.replace(",","."));
    if(!b||b<=0)return toast("Bitte gültigen Betrag!");
    if(!mForm.beschreibung.trim())return toast("Bitte Beschreibung eingeben!");
    await col("eintraege").add({typ:mForm.typ,betrag:b,beschreibung:mForm.beschreibung.trim(),person:mForm.person.trim(),datum:fmtD(mForm.datum),datumRaw:mForm.datum,zeit:new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}),gebuchtvon:cu.benutzername,ts:Date.now()});
    setMForm(f=>({...f,betrag:"",beschreibung:"",person:"",datum:todayStr()}));toast("✅ Gespeichert!");setTab("verlauf");
  };
  const addSp=async()=>{if(!nName.trim())return toast("Bitte Namen eingeben!");if(spieler.find(s=>s.name.toLowerCase()===nName.trim().toLowerCase()))return toast("Spieler existiert bereits!");await col("spieler").add({name:nName.trim()});setNName("");toast("✅ Hinzugefügt!");};
  const delSp=async(id)=>{await ref("spieler",id).delete();toast("🗑️ Gelöscht");};
  const saveEditSp=async()=>{if(!editSp.name.trim())return;await ref("spieler",editSp.id).set({name:editSp.name.trim()});setEditSp(null);toast("✅ Gespeichert");};
  const addGt=async()=>{const p=parseFloat(gForm.preis.replace(",","."));if(!gForm.name.trim()||!p||p<=0)return toast("Name und Preis erforderlich!");await col("getraenke").add({name:gForm.name.trim(),preis:p,emoji:gForm.emoji});setGForm({name:"",preis:"",emoji:"🥤"});toast("✅ Hinzugefügt!");};
  const delGt=async(id)=>{await ref("getraenke",id).delete();toast("🗑️ Gelöscht");};
  const saveEditGt=async()=>{const p=parseFloat(String(editG.preis).replace(",","."));if(!editG.name.trim()||!p)return;await ref("getraenke",editG.id).set({name:editG.name.trim(),preis:p,emoji:editG.emoji});setEditG(null);toast("✅ Gespeichert");};
  const delE=async(id)=>{await ref("eintraege",id).delete();toast("🗑️ Gelöscht");};

  const ein=eintraege.filter(e=>e.typ==="einnahme").reduce((s,e)=>s+e.betrag,0);
  const aus=eintraege.filter(e=>e.typ==="ausgabe").reduce((s,e)=>s+e.betrag,0);
  const spe=eintraege.filter(e=>e.typ==="spende").reduce((s,e)=>s+e.betrag,0);
  const gSum=eintraege.filter(e=>e.typ==="getraenk").reduce((s,e)=>s+e.betrag,0);
  const kasse=ein+spe+gSum-aus;
  const sortE=[...eintraege].sort((a,b)=>(b.ts||0)-(a.ts||0));
  const verl=sortE.filter(e=>vF==="alle"||e.typ===vF).filter(e=>vS==="alle"||e.spielerId===vS);
  const navs=[["konto","👤","Mein Konto"],["buchen","⚡","Buchen"],["neu","✏️","Manuell"],["übersicht","📊","Übersicht"],["verlauf","📋","Verlauf"],["spieler","👥","Spieler"],...(isAdmin?[["benutzer","👑","Benutzer"]]:[])];

  if(loading)return <div style={{minHeight:"100vh",background:"#00112E",display:"flex",alignItems:"center",justifyContent:"center"}}><img src={LOGO} style={{width:80,objectFit:"contain"}}/></div>;

  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(160deg,#00112E,#001A3A)",color:"#e2e8f0",maxWidth:480,margin:"0 auto",position:"relative"}}>

      <div style={{background:"linear-gradient(135deg,#003F8A,#001F50)",padding:"14px 20px",borderBottom:"2px solid #0055AA",position:"sticky",top:0,zIndex:20}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <img src={LOGO} style={{width:38,height:38,objectFit:"contain",flexShrink:0}}/>
          <div>
            <div style={{fontSize:16,fontWeight:800}}>HSG Emden Kasse</div>
            <div style={{fontSize:11,color:"#93c5fd"}}>🔴 Live · {cu.vorname} {cu.nachname} {isAdmin?"👑":""}</div>
          </div>
          <div style={{marginLeft:"auto",background:kasse>=0?"rgba(74,222,128,0.15)":"rgba(248,113,113,0.15)",border:`1px solid ${kasse>=0?"#4ade80":"#f87171"}`,borderRadius:10,padding:"5px 10px",textAlign:"right"}}>
            <div style={{fontSize:10,color:"#94a3b8"}}>Kassenstand</div>
            <div style={{fontSize:16,fontWeight:800,color:kasse>=0?"#4ade80":"#f87171"}}>{kasse.toFixed(2)} €</div>
          </div>
          <button onClick={onLogout} style={{marginLeft:6,background:"rgba(255,255,255,0.05)",border:"1px solid #003070",color:"#64748b",borderRadius:9,padding:"7px 9px",fontSize:14,cursor:"pointer",flexShrink:0}}>🔒</button>
        </div>
      </div>

      <div style={{paddingBottom:95}}>

        {tab==="konto"&&(()=>{
          const meineBuchungen = [...eintraege].filter(e=>e.person===cu.vorname+" "+cu.nachname||e.spielerId===spieler.find(s=>s.name===cu.vorname+" "+cu.nachname)?.id).sort((a,b)=>(b.ts||0)-(a.ts||0));
          const meineGetraenke = meineBuchungen.filter(e=>e.typ==="getraenk");
          const getraenkGesamt = meineGetraenke.reduce((s,e)=>s+e.betrag,0);
          const meineBenutzer = benutzer.find(b=>b.id===cu.id);
          const meinGuthaben = meineBenutzer?.guthaben||0;
          // Lieblingsgetraenk

          meineGetraenke.forEach(e=>{gCount[e.beschreibung]=(gCount[e.beschreibung]||0)+1;});

          // Zahlarten

          const perDirekt   = meineGetraenke.filter(e=>e.zahlart==="direkt").length;
          return (

              {/* Profil-Karte */}

                <div style={{width:56,height:56,borderRadius:"50%",background:"linear-gradient(135deg,#0066CC,#2288FF)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,fontWeight:800,color:"white",flexShrink:0}}>{ava(cu.vorname+" "+cu.nachname)}</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:18,fontWeight:800}}>{cu.vorname} {cu.nachname}</div>

                  <div style={{fontSize:24,marginBottom:4}}>💶</div>

                    <span style={{fontSize:20}}>{editG.emoji}</span>
                    <input value={editG.name} onChange={e=>setEditG(x=>({...x,name:e.target.value}))} style={{...IS,marginTop:0,flex:2}}/>
                    <input type="number" value={editG.preis} onChange={e=>setEditG(x=>({...x,preis:e.target.value}))} style={{...IS,marginTop:0,flex:1}}/>
                    <button onClick={saveEditGt} style={{padding:"0 12px",background:"#4ade8022",border:"1px solid #4ade80",color:"#4ade80",borderRadius:10,cursor:"pointer",fontWeight:700,height:48}}>✓</button>
                    <button onClick={()=>setEditG(null)} style={{padding:"0 10px",background:"rgba(255,255,255,0.05)",border:"1px solid #003070",color:"#94a3b8",borderRadius:10,cursor:"pointer",height:48}}>✕</button>
                  </div>
                ):(
                  <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderRadius:12,marginBottom:8,background:"rgba(255,255,255,0.03)",border:"1px solid #2288FF22"}}>
                    <span style={{fontSize:20}}>{g.emoji}</span>
                    <span style={{flex:1,fontWeight:700}}>{g.name}</span>
                    <span style={{color:"#2288FF",fontWeight:800}}>{g.preis.toFixed(2)} €</span>
                    <button onClick={()=>setEditG(g)} style={{background:"rgba(34,136,255,0.1)",border:"1px solid rgba(34,136,255,0.3)",color:"#2288FF",borderRadius:7,padding:"4px 9px",fontSize:12,cursor:"pointer"}}>✏️</button>
                    <button onClick={()=>delGt(g.id)} style={{background:"rgba(248,113,113,0.1)",border:"1px solid rgba(248,113,113,0.3)",color:"#f87171",borderRadius:7,padding:"4px 9px",fontSize:12,cursor:"pointer"}}>🗑️</button>
                  </div>
                )}
              </div>
            ))}
          </div>
        )}

        {tab==="benutzer"&&isAdmin&&<BenutzerTab benutzer={benutzer} cu={cu} toast={toast}/>}
      </div>

      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:"rgba(0,17,46,0.97)",backdropFilter:"blur(20px)",borderTop:"1px solid #003F8A",display:"flex",padding:"8px 0 20px",zIndex:20}}>
        {navs.map(([key,emoji,label])=>(
          <button key={key} onClick={()=>setTab(key)} style={{flex:1,background:"none",border:"none",color:tab===key?"#2288FF":"#475569",cursor:"pointer",padding:"6px 0",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
            <div style={{fontSize:18}}>{emoji}</div>
            <div style={{fontSize:9,fontWeight:tab===key?700:400}}>{label}</div>
          </button>
        ))}
      </div>

      {toastMsg&&<div style={{position:"fixed",top:70,left:"50%",transform:"translateX(-50%)",background:"#003F8A",border:"1px solid #0055AA",color:"#e2e8f0",padding:"11px 22px",borderRadius:12,fontSize:13,fontWeight:700,zIndex:100,boxShadow:"0 8px 30px rgba(0,0,0,0.5)",whiteSpace:"nowrap"}}>{toastMsg}</div>}
    </div>
  );
}

function App() {
  const [cu,setCu]=useState(()=>ld(AUTH_KEY,null));
  const [benutzer,setBenutzer]=useState([]);
  const [loading,setLoading]=useState(true);
  useEffect(()=>{
    return col("benutzer").onSnapshot(snap=>{
      const list=snap.docs.map(d=>({id:d.id,...d.data()}));
      if(list.length===0)col("benutzer").add({vorname:"Admin",nachname:"HSG",benutzername:"admin.hsg",passwort:"hsgherren33",rolle:"admin",mannschaft:"1. Herren",guthaben:0});
      setBenutzer(list);setLoading(false);
    });
  },[]);
  if(loading)return <div style={{minHeight:"100vh",background:"#00112E",display:"flex",alignItems:"center",justifyContent:"center"}}><img src={LOGO} style={{width:80,objectFit:"contain"}}/></div>;
  if(!cu)return <Login onLogin={u=>{sv(AUTH_KEY,u);setCu(u);}} benutzer={benutzer}/>;
  return <MainApp cu={cu} onLogout={()=>{sv(AUTH_KEY,null);setCu(null);}}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
